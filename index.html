
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>セリフからぽこピー動画検索</title>

<meta name="description" content="ぽこピーの動画・生放送で話されていたセリフから、元の動画を検索できるサイトです。">

<meta property="og:type" content="website">
<meta property="og:url" content="https://dimebag29.github.io/PokoPeaVideoSearchBySpokenWords/">
<meta property="og:title" content="セリフからぽこピー動画検索">
<meta property="og:description" content="ぽこピーの動画・生放送で話されていたセリフから、元の動画を検索できるサイトです。">
<meta property="og:image" content="https://dimebag29.github.io/PokoPeaVideoSearchBySpokenWords/ogp.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="セリフからぽこピー動画検索">
<meta name="twitter:description" content="ぽこピーの動画・生放送で話されていたセリフから、元の動画を検索できるサイトです。">
<meta name="twitter:image" content="https://dimebag29.github.io/PokoPeaVideoSearchBySpokenWords/ogp.png">

<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f6fa;color:#252936;font-family:system-ui,sans-serif}
main{max-width:900px;margin:0 auto;padding:32px 18px}
h1{font-size:28px;margin-bottom:8px}
p{line-height:1.7}
.description{line-height:1.7}
.description+.description{margin-top:1em}
.search{display:flex;gap:8px;margin:24px 0 12px}
input{flex:1;min-width:0;padding:14px;font-size:16px;border:1px solid #ccc;border-radius:8px}
button{padding:12px 20px;font-size:16px;border:0;border-radius:8px;background:#315ee8;color:white;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
#status,#count{color:#606777;font-size:14px}
.result{background:white;border:1px solid #e0e3eb;border-radius:10px;padding:18px;margin:14px 0}
.result-content{display:flex;align-items:center;justify-content:space-between;gap:16px}
.result-info{flex:1;min-width:0}
.result h2{font-size:17px;margin:0;overflow-wrap:anywhere}
.result-title{color:#252936;text-decoration:none}
.result-title:hover{color:#315ee8;text-decoration:underline}
.result-title:focus-visible{outline:2px solid #315ee8;outline-offset:3px}
.result-thumb-link{display:block;width:180px;max-width:38%;flex-shrink:0;border-radius:6px;overflow:hidden}
.result-thumb{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.result-thumb-link:focus-visible{outline:3px solid #315ee8;outline-offset:3px}
@media(max-width:500px){
  main{padding:24px 14px}
  h1{font-size:24px}
  .search{flex-direction:column}
  button{width:100%}
  .result-content{gap:10px}
  .result-thumb-link{width:120px;max-width:38%}
}
</style>
</head>
<body>
<main>
<h1>セリフからぽこピー動画検索</h1>

<p class="description">「ぽんぽこちゃんねる」、「ぽんぽこの秘密基地」、「ぽこピーのゆめうつつ」、「ピーナッツくん!オシャレになりたい!」チャンネルの動画･生放送内で話されていたセリフから、その動画･生放送を探し出します。2026年9月27日までに公開された動画･生放送を検索できます。</p>

<p class="description">目的のセリフが話されている動画内の時間を調べるには、YouTubeの動画説明欄を「もっと見る」で展開し、「文字起こしを表示」をクリックします。表示された文字起こしから目的のセリフを検索することで、そのセリフが話されている時間を確認できます。</p>

<div id="status">文字起こしデータを読み込み中...</div>

<form id="searchForm" class="search">
<input id="query" type="search" placeholder="動画内で話されていたセリフを入力" autocomplete="off">
<button id="searchButton" disabled>検索</button>
</form>

<div id="count"></div>
<div id="results"></div>
</main>

<script>
const TRANSCRIPT_FILES=[
  "VideoIdAndSpokenWords_001.json",
  "VideoIdAndSpokenWords_002.json",
  "VideoIdAndSpokenWords_003.json"
];
const TITLES_FILE="IdAndTitles.json";
let videos=[];
const status=document.getElementById("status");
const query=document.getElementById("query");
const button=document.getElementById("searchButton");
const count=document.getElementById("count");
const results=document.getElementById("results");

async function fetchJson(file){
  const response=await fetch("./"+file);
  if(!response.ok)throw Error(file+" の読み込みに失敗しました (HTTP "+response.status+")");
  return response.json();
}

async function loadData(){
  try{
    const [transcriptSets,titles]=await Promise.all([
      Promise.all(TRANSCRIPT_FILES.map(fetchJson)),
      fetchJson(TITLES_FILE)
    ]);
    const transcripts=Object.assign({},...transcriptSets);
    videos=Object.entries(transcripts).map(([id,text])=>({
      id,
      title:titles[id]||id,
      lower:String(text).toLocaleLowerCase()
    }));
    status.textContent="";
    button.disabled=false;
  }catch(error){
    status.textContent="データの読み込みに失敗しました："+error.message;
    console.error(error);
  }
}

document.getElementById("searchForm").addEventListener("submit",e=>{
  e.preventDefault();
  const words=query.value.trim().toLocaleLowerCase().split(/\s+/).filter(Boolean);
  results.replaceChildren();

  if(!words.length){
    count.textContent="検索するワードを入力してください。";
    return;
  }

  const found=videos.filter(v=>words.every(w=>v.lower.includes(w)));
  count.textContent=`検索結果：${found.length.toLocaleString()}本`;
  const fragment=document.createDocumentFragment();

  for(const v of found.slice(0,1000)){
    const card=document.createElement("article");
    card.className="result";

    const content=document.createElement("div");
    content.className="result-content";

    const info=document.createElement("div");
    info.className="result-info";

    const title=document.createElement("h2");
    const titleLink=document.createElement("a");
    titleLink.className="result-title";
    titleLink.textContent=v.title;
    titleLink.href="https://www.youtube.com/watch?v="+encodeURIComponent(v.id);
    titleLink.target="_blank";
    titleLink.rel="noopener noreferrer";
    title.append(titleLink);

    const a=document.createElement("a");
    a.className="result-thumb-link";
    a.href=titleLink.href;
    a.target="_blank";
    a.rel="noopener noreferrer";
    a.setAttribute("aria-label",v.title+"（YouTubeで開く）");

    const img=document.createElement("img");
    img.className="result-thumb";
    img.src="https://img.youtube.com/vi/"+encodeURIComponent(v.id)+"/mqdefault.jpg";
    img.alt="動画サムネイル";
    img.loading="lazy";
    img.referrerPolicy="no-referrer";
    img.onerror=()=>{a.style.display="none"};

    a.append(img);
    info.append(title);
    content.append(info,a);
    card.append(content);
    fragment.append(card);
  }

  if(found.length>1000){
    const note=document.createElement("p");
    note.textContent="最初の1,000件を表示しています。検索ワードを追加して絞り込んでください。";
    fragment.append(note);
  }

  if(!found.length){
    const p=document.createElement("p");
    p.textContent="該当する動画が見つかりませんでした。別のワードでもお試しください。";
    fragment.append(p);
  }

  results.append(fragment);
});

loadData();
</script>
</body>
</html>
